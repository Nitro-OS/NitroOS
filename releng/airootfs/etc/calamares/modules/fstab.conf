---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime,compress=zstd:3,subvol=@
    ext4: defaults,noatime
    f2fs: defaults,noatime
    xfs: defaults,noatime

efiMountOptions: defaults,umask=0077

ssdExtraMountOptions:
    ext4: discard
    btrfs: discard=async
    f2fs: discard
    xfs: discard
