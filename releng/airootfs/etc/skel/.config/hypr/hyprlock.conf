font_family = $font_family Thin

background {
    monitor =
    color = $wallbash_pry1_rgba
    path = screenshot
    blur_size = 5
    blur_passes = 5
    noise = 0.2
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:60000] echo "󰌢 $USER • $(uptime -p 2>/dev/null | sed 's/up //')"
    color = $wallbash_4xa9_rgba
    font_size = 14
    font_family = CommitMono Nerd Font
    position = 30, -25
    halign = left
    valign = top
}

# Battery & Game Mode Status
label {
    monitor =
    text = cmd[update:3000] echo "$(~/.config/hypr/scripts/battery.sh 2>/dev/null) $([ -f /tmp/hypr_gamemode.state ] && echo '• 󰊴 GAME')"
    color = $wallbash_4xa9_rgba
    font_size = 14
    font_family = CommitMono Nerd Font
    position = -30, -25
    halign = right
    valign = top
}

# DAY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A" | sed 's/./& /g' | tr '[:lower:]' '[:upper:]')"
    color = $wallbash_1xa9_rgba
    font_size = 110
    font_family = Anurati
    position = 0, 100
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d")"
    color = $wallbash_2xa9_rgba
    font_size = 35
    font_family = $font_family Thin
    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $wallbash_txt1_rgba
    font_size = 20 
    font_family = $font_family
    position = 0, 150
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $wallbash_pry4_rgba
    inner_color = $wallbash_pry2_rgba
    font_color = $wallbash_3xa9_rgba
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Input Password...
    hide_input = false
    rounding = -1
    check_color = $wallbash_pry4_rgba
    fail_color = rgba(FF0000FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, 80
    halign = center
    valign = bottom
}

# User tag & Greetings
label {
    monitor =
    text = cmd[update:60000] echo "Good $(date +'%H' | awk '{if ($1 < 12) print "Morning"; else if ($1 < 18) print "Afternoon"; else print "Evening"}'), $USER"
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = Inter Display Medium
    position = 0, 30
    halign = center
    valign = bottom
}

